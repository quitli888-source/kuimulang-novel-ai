<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <!-- 水墨渐变 -->
    <linearGradient id="inkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a52;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d2137;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1929;stop-opacity:1" />
    </linearGradient>
    
    <!-- 青色发光 -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 金色点缀 -->
    <radialGradient id="goldDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- 背景装饰 - 淡墨水晕染 -->
  <ellipse cx="100" cy="60" rx="90" ry="50" fill="url(#inkGradient)" opacity="0.1"/>
  
  <!-- 奎 - 艺术化设计 -->
  <g transform="translate(20, 25) scale(1.3)">
    <!-- 大字 -->
    <text x="0" y="35" 
          font-family="STXingkai, 'Xingkai SC', 'Kaiti SC', cursive" 
          font-size="42" 
          font-weight="bold"
          fill="url(#inkGradient)"
          filter="url(#cyanGlow)">
      奎
    </text>
    <!-- 青色边缘 -->
    <text x="0" y="35" 
          font-family="STXingkai, 'Xingkai SC', 'Kaiti SC', cursive" 
          font-size="42" 
          font-weight="bold"
          fill="none"
          stroke="#00d4ff"
          stroke-width="0.5"
          opacity="0.6">
      奎
    </text>
  </g>
  
  <!-- 木 - 艺术化设计 -->
  <g transform="translate(75, 25) scale(1.3)">
    <text x="0" y="35" 
          font-family="STXingkai, 'Xingkai SC', 'Kaiti SC', cursive" 
          font-size="42" 
          font-weight="bold"
          fill="url(#inkGradient)"
          filter="url(#cyanGlow)">
      木
    </text>
    <text x="0" y="35" 
          font-family="STXingkai, 'Xingkai SC', 'Kaiti SC', cursive" 
          font-size="42" 
          font-weight="bold"
          fill="none"
          stroke="#00d4ff"
          stroke-width="0.5"
          opacity="0.6">
      木
    </text>
  </g>
  
  <!-- 狼 - 艺术化设计 -->
  <g transform="translate(130, 25) scale(1.3)">
    <text x="0" y="35" 
          font-family="STXingkai, 'Xingkai SC', 'Kaiti SC', cursive" 
          font-size="42" 
          font-weight="bold"
          fill="url(#inkGradient)"
          filter="url(#cyanGlow)">
      狼
    </text>
    <text x="0" y="35" 
          font-family="STXingkai, 'Xingkai SC', 'Kaiti SC', cursive" 
          font-size="42" 
          font-weight="bold"
          fill="none"
          stroke="#00d4ff"
          stroke-width="0.5"
          opacity="0.6">
      狼
    </text>
  </g>
  
  <!-- 金色装饰点 -->
  <circle cx="35" cy="85" r="3" fill="url(#goldDot)" opacity="0.8"/>
  <circle cx="165" cy="85" r="2" fill="url(#goldDot)" opacity="0.6"/>
  
  <!-- 底部发光线 -->
  <line x1="30" y1="95" x2="170" y2="95" 
        stroke="#00d4ff" 
        stroke-width="1" 
        opacity="0.5"
        filter="url(#cyanGlow)"/>
</svg>