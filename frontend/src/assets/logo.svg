<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 圆角渐变背景 -->
  <rect x="8" y="8" width="104" height="104" rx="20" fill="url(#bgGrad)"/>
  
  <!-- 内边框装饰 -->
  <rect x="10" y="10" width="100" height="100" rx="18" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- 奎木狼文字 -->
  <g transform="translate(60, 56)">
    <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="800" fill="url(#textGrad)" letter-spacing="2" filter="url(#glow)">
      奎木狼
    </text>
    <!-- 装饰线 -->
    <line x1="-32" y1="20" x2="32" y2="20" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="20" r="3" fill="white" fill-opacity="0.8"/>
  </g>
  
  <!-- AI标识 -->
  <g transform="translate(60, 92)">
    <rect x="-20" y="-8" width="40" height="16" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="white" letter-spacing="1.5">
      AI
    </text>
  </g>
</svg>