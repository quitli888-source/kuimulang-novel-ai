<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="280" height="100">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a5d8ff;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 透明背景 -->
  
  <!-- 主文字 - 使用系统黑体，清晰锐利 -->
  <text x="140" y="72" 
        text-anchor="middle"
        font-family="'Microsoft YaHei', 'Heiti SC', 'PingFang SC', 'STHeiti', sans-serif"
        font-size="72"
        font-weight="bold"
        letter-spacing="6"
        fill="url(#textGrad)"
        filter="url(#glow)">
    奎木狼
  </text>
</svg>