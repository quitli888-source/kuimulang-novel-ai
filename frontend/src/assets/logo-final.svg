<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" width="280" height="140">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e0f7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3e5fc;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </linearGradient>
    
    <!-- 发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景发光效果 -->
  <ellipse cx="140" cy="70" rx="130" ry="60" fill="#00d4ff" opacity="0.05" filter="url(#softGlow)"/>
  
  <!-- 主文字 - 特大号 -->
  <g filter="url(#glow)">
    <text x="140" y="95" 
          text-anchor="middle"
          font-family="'Noto Serif SC', 'Source Han Serif SC', 'STSong', 'SimSun', serif"
          font-size="80"
          font-weight="900"
          letter-spacing="8"
          fill="url(#textGrad)">
      奎木狼
    </text>
  </g>
  
  <!-- 顶部装饰线 -->
  <line x1="30" y1="20" x2="250" y2="20" stroke="url(#glowGrad)" stroke-width="1" opacity="0.6"/>
  
  <!-- 底部装饰线 -->
  <line x1="30" y1="120" x2="250" y2="120" stroke="url(#glowGrad)" stroke-width="1" opacity="0.6"/>
  
  <!-- 左右装饰点 -->
  <circle cx="20" cy="70" r="3" fill="#00d4ff" opacity="0.8"/>
  <circle cx="260" cy="70" r="3" fill="#00d4ff" opacity="0.8"/>
</svg>